# Values do chart datadog/datadog aplicados pelo workflow .github/workflows/datadog.yml.
# API key (Secret datadog-secret) e site (var DD_SITE) são injetados pelo workflow.
datadog:
  apiKeyExistingSecret: datadog-secret
  # Datadog só aceita [a-z0-9-] no nome do cluster; o nome real do EKS vai na tag eks_cluster.
  clusterName: garage-flow-eks
  tags:
    - "env:producao"
    - "eks_cluster:garage_flow_eks"

  kubelet:
    tlsVerify: false

  # Nodes do EKS Auto Mode são Bottlerocket com SELinux enforcing: spc_t libera a leitura de /var/log/pods e /proc.
  securityContext:
    runAsUser: 0
    seLinuxOptions:
      user: system_u
      role: system_r
      type: spc_t
      level: s0

  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true

  # APM via Service local (internalTrafficPolicy: Local): sem hostPort nem socket hostPath nos pods das aplicações.
  apm:
    socketEnabled: false
    portEnabled: false
    useLocalService: true

  dogstatsd:
    useSocketVolume: false
    nonLocalTraffic: true

  processAgent:
    enabled: true
    processCollection: true
    containerCollection: true

  kubeStateMetricsCore:
    enabled: true

  collectEvents: true
  orchestratorExplorer:
    enabled: true

  # Dispensa o system-probe (eBPF), que exige privilégios extras e não é necessário para a demo.
  networkMonitoring:
    enabled: false
  serviceMonitoring:
    enabled: false
  discovery:
    enabled: false

clusterAgent:
  enabled: true
  replicas: 1
  admissionController:
    enabled: true
    # Só pods com o label admission.datadoghq.com/enabled=true são alterados.
    mutateUnlabelled: false
    configMode: service
    failurePolicy: Ignore

agents:
  containers:
    agent:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    traceAgent:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    processAgent:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
