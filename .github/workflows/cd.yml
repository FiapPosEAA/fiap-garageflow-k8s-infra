name: CD Kubernetes Infrastructure

on:
  push:
    branches: [main, homologacao]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-2' }}
      TF_VAR_sql_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_sql_db_user: ${{ secrets.DB_USER }}
      TF_VAR_sql_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_cluster_name: ${{ secrets.CLUSTER_NAME || 'garageflow' }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}
      - run: terraform init
      - run: terraform apply -auto-approve